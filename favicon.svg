<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Edelweiss">
  <title>Edelweiss</title>

  <!-- Transparenter Hintergrund: kein <rect> -->

  <!-- Acht grüne Blütenblätter -->
  <g fill="#1a8a70" stroke="#0e6b57" stroke-width="1">
    <ellipse cx="32" cy="15" rx="5.5" ry="12"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(45 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(90 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(135 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(180 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(225 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(270 32 32)"/>
    <ellipse cx="32" cy="15" rx="5.5" ry="12" transform="rotate(315 32 32)"/>
  </g>

  <!-- Blütenkörbchen in Blau -->
  <circle cx="32" cy="32" r="8" fill="#2f7f9e"/>
  <circle cx="32" cy="32" r="2.8" fill="#ffffff"/>
</svg>