<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Körper -->
  <rect x="3" y="5" width="10" height="9" fill="#8B5E3C"/>
  <!-- Kopf -->
  <rect x="3" y="1" width="10" height="5" fill="#A0703C"/>
  <!-- Ohren/Büschel -->
  <rect x="3" y="0" width="2" height="2" fill="#6B4226"/>
  <rect x="11" y="0" width="2" height="2" fill="#6B4226"/>
  <!-- Sonnenbrille - Bügel -->
  <rect x="1" y="3" width="2" height="1" fill="#1A1A1A"/>
  <rect x="13" y="3" width="2" height="1" fill="#1A1A1A"/>
  <!-- Sonnenbrille - linkes Glas -->
  <rect x="4" y="2" width="3" height="3" fill="#1A1A1A"/>
  <rect x="5" y="3" width="1" height="1" fill="#4A90D9"/>
  <!-- Sonnenbrille - rechtes Glas -->
  <rect x="9" y="2" width="3" height="3" fill="#1A1A1A"/>
  <rect x="10" y="3" width="1" height="1" fill="#4A90D9"/>
  <!-- Sonnenbrille - Steg -->
  <rect x="7" y="2" width="2" height="1" fill="#1A1A1A"/>
  <!-- Schnabel -->
  <rect x="7" y="5" width="2" height="2" fill="#D4A030"/>
  <!-- Bauch -->
  <rect x="5" y="7" width="6" height="4" fill="#C49A6C"/>
  <!-- Flügel links -->
  <rect x="2" y="6" width="2" height="6" fill="#6B4226"/>
  <rect x="3" y="6" width="1" height="5" fill="#8B5E3C"/>
  <!-- Flügel rechts -->
  <rect x="12" y="6" width="2" height="6" fill="#6B4226"/>
  <rect x="12" y="6" width="1" height="5" fill="#8B5E3C"/>
  <!-- Füße -->
  <rect x="5" y="14" width="2" height="1" fill="#D4A030"/>
  <rect x="9" y="14" width="2" height="1" fill="#D4A030"/>
</svg>